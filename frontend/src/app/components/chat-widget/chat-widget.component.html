<!-- Floating Chat Button -->
<button 
  *ngIf="!chatService.isChatOpen()"
  (click)="toggleChat()"
  class="fixed bottom-6 right-6 w-16 h-16 rounded-full shadow-[0_0_20px_rgba(0,229,255,0.4)] dark:shadow-[0_0_25px_rgba(0,229,255,0.3)] hover:scale-105 transition-all flex items-center justify-center z-50 animate-bounce-slight border-2 border-[var(--color-accent-cyan)] p-0.5"
  aria-label="Open AI Assistant"
>
  <img src="assets/ai-avatar.png" alt="AI Assistant" class="w-full h-full rounded-full object-cover">
  <div class="absolute -top-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-white dark:border-slate-900 animate-pulse"></div>
</button>

<!-- Chat Window -->
<div 
  *ngIf="chatService.isChatOpen()"
  class="fixed bottom-6 right-6 w-80 sm:w-96 bg-white/90 dark:bg-slate-950/90 backdrop-blur-xl border border-[var(--color-accent-cyan)]/30 dark:border-[var(--color-accent-cyan)]/40 rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,229,255,0.3)] overflow-hidden flex flex-col z-50 chat-window-anim chat-window-dimensions"
>
  <!-- Header -->
  <div class="bg-white dark:bg-slate-900 border-b border-gray-100 dark:border-slate-800 p-4 flex items-center justify-between text-gray-900 dark:text-white relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-[var(--color-accent-cyan)] to-transparent opacity-50"></div>
    <div class="flex items-center gap-3 relative z-10">
      <div class="w-10 h-10 rounded-full border border-gray-200 relative overflow-hidden p-0.5">
        <img src="assets/ai-avatar.png" alt="AI Avatar" class="w-full h-full rounded-full object-cover">
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h3 class="font-bold text-sm text-gray-900 dark:text-white">TalentAI Assistant</h3>
          <span class="text-[10px] font-bold bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded-md">AI</span>
        </div>
        <p class="text-[11px] flex items-center gap-1.5 text-gray-500 mt-0.5">
          <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
          Online
        </p>
      </div>
    </div>
    <button (click)="toggleChat()" class="text-gray-400 hover:text-gray-700 hover:rotate-90 transition-all duration-300 p-1 relative z-10" aria-label="Close Chat">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Messages Area -->
  <div class="flex-1 p-4 overflow-y-auto bg-transparent relative" #messagesContainer>
    <div class="flex flex-col gap-4">
      <div *ngFor="let msg of chatService.messages()" 
           class="flex w-full"
           [ngClass]="msg.sender === 'user' ? 'justify-end' : 'justify-start'">
        <div class="w-6 h-6 rounded-full overflow-hidden shrink-0 mr-2 mt-auto" *ngIf="msg.sender !== 'user'">
          <img src="assets/ai-avatar.png" alt="AI Avatar" class="w-full h-full object-cover">
        </div>
        <div class="max-w-[80%] rounded-2xl p-3.5 text-sm"
             [ngClass]="msg.sender === 'user' 
                ? 'bg-gradient-to-r from-purple-500 to-blue-500 text-white border-none rounded-br-sm shadow-sm' 
                : 'bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-200 shadow-sm border border-gray-100 dark:border-slate-700 rounded-bl-sm'">
          <div [innerHTML]="msg.text" class="chat-message-text leading-relaxed"></div>
          
          <!-- Terminal style output for analysis messages -->
          <div *ngIf="msg.text.includes('Analyzing')" class="mt-3 bg-gray-50/50 rounded-lg p-3 border border-gray-100/50">
            <div class="font-mono text-[10px] text-green-600 space-y-1">
              <p>> Scanning 2,847 candidates...</p>
              <p>> Filtering by: Senior Developer</p>
              <p>> Skills: React, Node.js, Python</p>
              <p>> Experience: 5+ years</p>
              <p>> Location: Remote</p>
              <p class="text-green-700 font-bold mt-2">✓ Found 12 top matches!</p>
            </div>
          </div>
          
          <p class="text-[9px] mt-1 text-right opacity-60" [ngClass]="msg.sender === 'user' ? 'text-white' : 'text-gray-400'">
            {{ msg.timestamp | date:'shortTime' }}
          </p>
        </div>
      </div>

      <!-- Typing indicator -->
      <div *ngIf="isLoading()" class="flex justify-start">
        <div class="bg-white dark:bg-slate-800 shadow-sm border border-gray-100 dark:border-slate-700 rounded-2xl rounded-bl-sm p-4 flex gap-1 items-center relative overflow-hidden">
          <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce"></div>
          <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce anim-delay-100"></div>
          <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce anim-delay-200"></div>
        </div>
      </div>
    </div>
    
    <!-- Audio Waveform Decorative Graphic -->
    <div class="w-full flex justify-center items-center h-8 mt-4 mb-1 gap-0.5 opacity-60">
      <div class="w-1 h-2 bg-purple-300 rounded-full"></div>
      <div class="w-1 h-3 bg-purple-400 rounded-full"></div>
      <div class="w-1 h-5 bg-purple-500 rounded-full"></div>
      <div class="w-1 h-4 bg-blue-400 rounded-full"></div>
      <div class="w-1 h-6 bg-blue-500 rounded-full"></div>
      <div class="w-1 h-8 bg-cyan-400 rounded-full"></div>
      <div class="w-1 h-5 bg-blue-400 rounded-full"></div>
      <div class="w-1 h-3 bg-blue-300 rounded-full"></div>
      <div class="w-1 h-6 bg-cyan-500 rounded-full"></div>
      <div class="w-1 h-4 bg-purple-400 rounded-full"></div>
      <div class="w-1 h-2 bg-purple-300 rounded-full"></div>
      <div class="w-1 h-5 bg-blue-400 rounded-full"></div>
      <div class="w-1 h-7 bg-cyan-400 rounded-full"></div>
      <div class="w-1 h-3 bg-blue-300 rounded-full"></div>
      <div class="w-1 h-2 bg-purple-300 rounded-full"></div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="p-3 bg-white dark:bg-slate-900 border-t border-gray-100 dark:border-slate-800">
    <form (ngSubmit)="sendMessage()" class="flex items-center gap-2">
      <input 
        type="text" 
        [name]="'message'"
        [(ngModel)]="newMessage" 
        placeholder="Ask me anything..." 
        [disabled]="isLoading()"
        class="flex-1 bg-white dark:bg-slate-800 dark:text-white border border-gray-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500/50 outline-none shadow-sm"
        autocomplete="off"
      >
      <button 
        type="submit" 
        [disabled]="isLoading() || !newMessage().trim()"
        class="w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 flex items-center justify-center text-white shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-colors shrink-0"
        aria-label="Send Message"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-[-2px]">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>
</div>
