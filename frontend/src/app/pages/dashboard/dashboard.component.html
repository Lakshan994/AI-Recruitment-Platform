<div class="min-h-[calc(100vh-4rem)] relative" *ngIf="user">
	<div class="max-w-7xl mx-auto px-6 py-12 relative z-10">

		<div class="grid grid-cols-1 lg:grid-cols-4 gap-8">

			<!-- Left Column: User Profile Panel -->
			<div class="lg:col-span-1 space-y-6">
				<!-- Premium Profile Card -->
				<div class="glass-card p-6 rounded-[32px] text-center relative overflow-hidden animate-fade-in-up shadow-[0_8px_32px_rgba(0,0,0,0.05)] bg-white/90 dark:bg-slate-900/90 backdrop-blur-md">
					<div class="absolute top-4 right-4 bg-slate-900/80 border dark:border-slate-800 text-blue-500 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
						{{ user.role }}
					</div>
					<div class="w-28 h-28 rounded-full mx-auto mb-4 bg-gradient-to-br from-blue-500 via-blue-600 to-indigo-700 border-2 dark:border-slate-800 p-1 shadow-lg shadow-[0_0_30px_rgba(59,130,246,0.15)]">
						<div class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center text-3xl font-black text-white uppercase">
							{{ user.firstName[0] }}
						</div>
					</div>
					<h3 class="text-2xl font-extrabold text-slate-900 dark:text-white mb-2">{{ user.firstName }}</h3>
					<p class="text-xs font-semibold text-slate-600 dark:text-slate-400">{{ user.email }}</p>
				</div>

				<!-- Quick Navigation Buttons -->
				<div class="glass-card p-6 rounded-[32px] space-y-3 animate-fade-in-up [animation-delay:0.1s] bg-white/90 dark:bg-slate-900/90 backdrop-blur-md">
					<h4 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-4 pl-2">Quick Access</h4>

					<button (click)="navigate('/profile')" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-all duration-300 text-sm font-bold text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white flex items-center justify-between group">
						<div class="flex items-center gap-3">
							<svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
							</svg>
							<span>Profile Settings</span>
						</div>
						<svg class="w-4 h-4 text-blue-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
						</svg>
					</button>

					<button (click)="navigate('/jobs')" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-all duration-300 text-sm font-bold text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white flex items-center justify-between group">
						<div class="flex items-center gap-3">
							<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
							</svg>
							<span>Browse Jobs</span>
						</div>
						<svg class="w-4 h-4 text-blue-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
						</svg>
					</button>

					<button (click)="navigate('/insights')" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-all duration-300 text-sm font-bold text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white flex items-center justify-between group">
						<div class="flex items-center gap-3">
							<svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
							</svg>
							<span>AI Insights</span>
						</div>
						<svg class="w-4 h-4 text-blue-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
						</svg>
					</button>
				</div>
			</div>

			<!-- Center Workspace Area -->
			<div class="lg:col-span-3 space-y-8">

				<!-- Welcome Intro Section -->
				<div class="glass-card p-10 md:p-12 rounded-3xl border dark:border-slate-800 shadow-[0_8px_32px_rgba(0,0,0,0.05)] animate-fade-in-up backdrop-blur-md bg-white/90 dark:bg-slate-900/90 text-center">
					<h1 class="text-4xl md:text-5xl font-extrabold mb-4 text-slate-900 dark:text-white tracking-tight">
						Welcome, <span class="gradient-text">{{ user.firstName }}</span>! 👋
					</h1>
					<p class="text-slate-600 dark:text-slate-300 text-sm font-bold uppercase tracking-wider mb-0 max-w-2xl mx-auto">
						{{ subtitle }}
					</p>
				</div>

				<!-- Stat Cards Grid -->
				<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
					<div *ngFor="let stat of statCards; let i = index"
					class="stat-card glass-card p-6 rounded-2xl text-center relative overflow-hidden animate-fade-in-up shadow-lg border-b-4 bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm hover:-translate-y-1 transition-all duration-300" [ngClass=""
					 style.animationDelay=""]="(i * 0.1) + 's'">
						<p class="text-4xl font-black text-slate-900 dark:text-white mb-2">{{ stat.value }}</p>
						<p class="text-[11px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">{{ stat.label }}</p>
					</div>
				</div>

				<!-- Dynamic Actions Grid -->
				<h3 class="text-xl font-bold text-slate-900 dark:text-white mt-12 mb-6 flex items-center gap-3 animate-fade-in-up [animation-delay:0.3s]">
					<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
					</svg>
					Suggested Actions
				</h3>
				<div class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade-in-up [animation-delay:0.4s]">
					<div *ngFor="let action of actions; let i = index"
					class="glass-card p-8 rounded-3xl cursor-pointer hover:-translate-y-2 transition-all duration-300 group border dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-blue-500/10 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md"
					 click="")="navigate(action.link)">
						<div [class=""]="'w-14 h-14 rounded-2xl mb-6 flex items-center justify-center text-white shadow-lg bg-gradient-to-br ' + action.color">
							<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
							</svg>
						</div>
						<h4 class="text-xl font-bold text-slate-900 dark:text-white mb-3 group-hover:text-blue-500 transition-colors">{{ action.title }}</h4>
						<p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed font-medium">{{ action.desc }}</p>
						<div class="mt-6 flex items-center gap-2 text-blue-500 text-sm font-bold group-hover:translate-x-2 transition-transform">
							Get Started
							<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/>
							</svg>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>
</div>
