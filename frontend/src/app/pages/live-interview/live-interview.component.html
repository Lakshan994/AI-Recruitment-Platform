<div class="min-h-screen bg-slate-50 dark:bg-slate-900 flex flex-col transition-colors duration-300">
  
  <!-- Header -->
  <header class="bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 shadow-sm z-10 sticky top-0 transition-colors duration-300">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center text-blue-600 dark:text-blue-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        </div>
        <div>
          <h1 class="font-bold text-slate-800 dark:text-white text-lg">AI Hiring Manager</h1>
          <p class="text-xs text-green-600 font-medium flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            Live Interview
          </p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800" [ngClass]="{'text-red-500 animate-pulse': timeRemaining < 60, 'text-slate-700 dark:text-slate-300': timeRemaining >= 60}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="font-bold font-mono tracking-wider">{{ formattedTime }}</span>
        </div>
        <button (click)="finishInterview()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg text-sm font-semibold transition-colors">
          Finish & Exit
        </button>
      </div>
    </div>
  </header>

  <!-- Chat Container -->
  <div class="flex-1 overflow-y-auto p-4 scroll-smooth" #chatContainer>
    <div class="max-w-4xl mx-auto flex flex-col gap-6 py-6">
      
      <div *ngIf="error" class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-4 rounded-xl text-center text-sm font-medium border border-red-100 dark:border-red-900/50">
        {{ error }}
      </div>

      <ng-container *ngFor="let msg of chatHistory">
        <!-- AI Message -->
        <div *ngIf="msg.role === 'model'" class="flex gap-4 max-w-[85%]">
          <div class="w-8 h-8 rounded-full bg-blue-600 flex-shrink-0 flex items-center justify-center text-white mt-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          </div>
          <div class="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 p-4 rounded-2xl rounded-tl-none shadow-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap text-sm md:text-base">
            {{ msg.text }}
          </div>
        </div>

        <!-- User Message -->
        <div *ngIf="msg.role === 'user'" class="flex gap-4 max-w-[85%] self-end flex-row-reverse">
          <div class="w-8 h-8 rounded-full bg-slate-300 dark:bg-slate-700 flex-shrink-0 flex items-center justify-center text-slate-600 dark:text-slate-300 mt-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </div>
          <div class="bg-blue-600 text-white p-4 rounded-2xl rounded-tr-none shadow-sm leading-relaxed whitespace-pre-wrap text-sm md:text-base">
            {{ msg.text }}
          </div>
        </div>
      </ng-container>

      <!-- Typing Indicator -->
      <div *ngIf="isTyping" class="flex gap-4 max-w-[85%]">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex-shrink-0 flex items-center justify-center text-white mt-1">
           <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>
        <div class="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 p-4 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-1.5 h-12">
          <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce delay-0"></div>
          <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce delay-150"></div>
          <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce delay-300"></div>
        </div>
      </div>
      
    </div>
  </div>

  <!-- Input Area -->
  <div class="bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 p-4 sticky bottom-0 transition-colors duration-300">
    <div class="max-w-4xl mx-auto relative">
      <textarea 
        [(ngModel)]="newMessage" 
        (keydown)="onKeydown($event)"
        [disabled]="isTyping || isFinished"
        placeholder="Type your answer here... (Press Enter to send, Shift+Enter for new line)"
        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl py-3 pl-4 pr-14 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 resize-none transition-colors disabled:opacity-50"
        rows="2"
      ></textarea>
      
      <button 
        (click)="sendMessage()" 
        [disabled]="!newMessage.trim() || isTyping || isFinished"
        title="Send Message"
        class="absolute right-3 bottom-3 w-8 h-8 bg-blue-600 hover:bg-blue-700 text-white rounded-lg flex items-center justify-center transition-colors disabled:opacity-50 disabled:hover:bg-blue-600"
      >
        <svg class="w-4 h-4 translate-x-px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      </button>
    </div>
    <p class="text-center text-[10px] text-slate-400 mt-2">AI can make mistakes. Consider verifying important information.</p>
  </div>

</div>
